# =============================================================================
# deploy.yml — Deploy OctoCAT to Azure Container Apps
# -----------------------------------------------------------------------------
# The workflow is intentionally small for the POC. Configure the OIDC secrets and
# repository variables described below before enabling automatic deployments.
#
# ----- OIDC setup (no client secret is ever stored) --------------------------
# 1. Create a user-assigned managed identity OR an app registration in Azure.
# 2. Grant it Contributor on the target resource group (or subscription scope).
# 3. Add a FEDERATED CREDENTIAL on it whose subject matches how this workflow
#    runs, e.g. for the main branch:
#        repo:<owner>/<repo>:ref:refs/heads/main
#    (or `repo:<owner>/<repo>:environment:<env>` if you gate on an environment).
# 4. Add these GitHub secrets — Settings > Secrets and variables > Actions:
#        AZURE_CLIENT_ID         (the identity/app client id)
#        AZURE_TENANT_ID
#        AZURE_SUBSCRIPTION_ID
#    and these repo/environment VARIABLES:
#        AZURE_RESOURCE_GROUP    (e.g. octocat-hack-rg)
#        AZURE_LOCATION          (e.g. eastus)
# No AZURE_CREDENTIALS / client secret is used — auth is OIDC only.
# =============================================================================

name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# OIDC: `id-token: write` lets the job request a short-lived federated token that
# azure/login exchanges for Azure creds. `contents: read` is for checkout.
permissions:
  id-token: write
  contents: read

env:
  # Pulled from the GitHub secrets/variables described in the header comment.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'octocat' }}
  ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME || 'dev' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Provision & deploy
    runs-on: ubuntu-latest
    # TODO: Consider binding to a GitHub Environment (e.g. `environment: dev`) so
    #       you can add reviewers/approval gates and environment-scoped secrets.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC login — note there is NO `creds:` input and no client secret.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        working-directory: src
        run: make install

      - name: Build application
        working-directory: src
        run: make build

      - name: Test API
        working-directory: src/api-ts
        run: npm test -- --run

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for variable in RESOURCE_GROUP LOCATION; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing GitHub repository variable for $variable" >&2
              exit 1
            fi
          done

      - name: Create resource group
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --tags project=octocat-supply environment="$ENVIRONMENT_NAME" managedBy=github-actions

      - name: Build & push images to ACR
        run: |
          set -euo pipefail
          ACR_NAME=$(printf '%s%sacr' "$NAME_PREFIX" "$ENVIRONMENT_NAME" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          az acr show --resource-group "$RESOURCE_GROUP" --name "$ACR_NAME" >/dev/null 2>&1 || \
            az acr create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$ACR_NAME" \
              --location "$LOCATION" \
              --sku Basic \
              --admin-enabled true \
              --tags project=octocat-supply environment="$ENVIRONMENT_NAME" managedBy=github-actions

          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          az acr login --name "$ACR_NAME"
          docker build --tag "$LOGIN_SERVER/api:$IMAGE_TAG" -f src/api-ts/Dockerfile src
          docker build --tag "$LOGIN_SERVER/frontend:$IMAGE_TAG" -f src/frontend/Dockerfile src/frontend
          docker push "$LOGIN_SERVER/api:$IMAGE_TAG"
          docker push "$LOGIN_SERVER/frontend:$IMAGE_TAG"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Deploy infrastructure (Bicep)
        run: |
          set -euo pipefail
          REGISTRY_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
          REGISTRY_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" --output tsv)
          echo "::add-mask::$REGISTRY_USERNAME"
          echo "::add-mask::$REGISTRY_PASSWORD"

          az deployment group create \
            --name main \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
              apiImage="$LOGIN_SERVER/api:$IMAGE_TAG" \
              frontendImage="$LOGIN_SERVER/frontend:$IMAGE_TAG" \
              location="$LOCATION" \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              registryUsername="$REGISTRY_USERNAME" \
              registryPassword="$REGISTRY_PASSWORD"

      - name: Verify deployment
        run: |
          set -euo pipefail
          FRONTEND_URL=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name main \
            --query properties.outputs.frontendUrl.value \
            --output tsv)
          API_FQDN=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name main \
            --query properties.outputs.apiFqdn.value \
            --output tsv)
          echo "Frontend URL: $FRONTEND_URL"
          echo "API URL: https://$API_FQDN"
          curl --fail --silent --show-error --retry 10 --retry-delay 15 "$FRONTEND_URL" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 15 "https://$API_FQDN/" >/dev/null

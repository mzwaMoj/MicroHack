name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'octocat' }}
  ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME || 'dev' }}
  IMAGE_TAG: ${{ github.sha }}
  APP_ROOT: 03-Azure/01-04-AI/01_Agentic_SDLC

jobs:
  deploy:
    name: Build, provision, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        working-directory: ${{ env.APP_ROOT }}/src
        run: make install

      - name: Build application
        working-directory: ${{ env.APP_ROOT }}/src
        run: make build

      - name: Test API
        working-directory: ${{ env.APP_ROOT }}/src/api-ts
        run: npm test -- --run

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for variable in RESOURCE_GROUP LOCATION; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing repository variable for $variable" >&2
              exit 1
            fi
          done

      - name: Create resource group
        run: |
          if az group show --name "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Using existing resource group: $RESOURCE_GROUP"
          else
            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --tags project=octocat-supply environment="$ENVIRONMENT_NAME" managedBy=github-actions
          fi

      - name: Build and push images to ACR
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          ACR_NAME=$(printf '%s%sacr' "$NAME_PREFIX" "$ENVIRONMENT_NAME" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          az acr show --resource-group "$RESOURCE_GROUP" --name "$ACR_NAME" >/dev/null 2>&1 || \
            az acr create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$ACR_NAME" \
              --location "$LOCATION" \
              --sku Basic \
              --admin-enabled true \
              --tags project=octocat-supply environment="$ENVIRONMENT_NAME" managedBy=github-actions
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          az acr login --name "$ACR_NAME"
          docker build --tag "$LOGIN_SERVER/api:$IMAGE_TAG" -f src/api-ts/Dockerfile src
          docker build --tag "$LOGIN_SERVER/frontend:$IMAGE_TAG" -f src/frontend/Dockerfile src/frontend
          docker push "$LOGIN_SERVER/api:$IMAGE_TAG"
          docker push "$LOGIN_SERVER/frontend:$IMAGE_TAG"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Deploy infrastructure (Bicep)
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          REGISTRY_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
          REGISTRY_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' --output tsv)
          echo "::add-mask::$REGISTRY_USERNAME"
          echo "::add-mask::$REGISTRY_PASSWORD"
          az deployment group create \
            --name main \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
              location="$LOCATION" \
              apiImage="$LOGIN_SERVER/api:$IMAGE_TAG" \
              frontendImage="$LOGIN_SERVER/frontend:$IMAGE_TAG" \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              registryUsername="$REGISTRY_USERNAME" \
              registryPassword="$REGISTRY_PASSWORD"

      - name: Verify deployment
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          FRONTEND_URL=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name main --query properties.outputs.frontendUrl.value --output tsv)
          API_FQDN=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name main --query properties.outputs.apiFqdn.value --output tsv)
          echo "Frontend URL: $FRONTEND_URL"
          echo "API URL: https://$API_FQDN"
          curl --fail --silent --show-error --retry 10 --retry-delay 15 "$FRONTEND_URL" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 15 "https://$API_FQDN/" >/dev/null
